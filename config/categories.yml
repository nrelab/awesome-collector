# Category taxonomy for awesome-collector.
#
# taxonomy: parent -> ordered list of leaf categories (the single source of truth)
# keywords: leaf category -> phrases matched against repo description/name/topics
# topics:   leaf category -> exact GitHub topic names
#
# Every leaf listed under `taxonomy` is the only kind of value the pipeline writes
# to the `categories` table; its parent is stored alongside it. Keywords and topics
# resolve to leaves, never to parents, so the DB only ever contains taxonomy names.

