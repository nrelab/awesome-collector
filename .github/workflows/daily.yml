name: Daily Awesome Collection

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Collect Awesome repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.main collect

      - name: Validate dataset
        run: |
          python -m src.main validate

      - name: Generate indexes
        run: |
          python -m src.main generate

      - name: Commit changes
        run: |
          git config user.name "awesome-collector[bot]"
          git config user.email "awesome-collector[bot]@users.noreply.github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): daily awesome repository update"
            git push
          fi