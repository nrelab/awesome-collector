[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-collector"
version = "0.1.0"
description = "Daily GitHub Actions Awesome Repository Collector - NRE Lab knowledge-base ecosystem"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "typing-extensions>=4.9",
    "aiohttp>=3.9",
    "tqdm>=4.66",
    "rich>=13.7",
    "httpx-retry>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
awesome = "src.main:cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100